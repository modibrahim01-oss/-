# المسارات هنا نسبية لمجلد trading/ نفسه.
# عند الربط بمستودع Git: اضبط «Base directory» على trading في لوحة Netlify،
# فيقرأ هذا الملف ويحلّ publish نسبةً إليه.
# وعند النشر من سطر الأوامر: شغّل الأمر من داخل مجلد trading.
[build]
  command = "npm run build"
  publish = "dist"

# التنقّل داخل التطبيق عبر hash، لكن نُبقي التحويل احتياطاً لأي رابط
# مباشر ولضمان عمل بدء التشغيل من شاشة الجوال.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# عامل الخدمة يجب ألا يُخزَّن، وإلا بقي التطبيق على نسخة قديمة بعد كل نشر.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
