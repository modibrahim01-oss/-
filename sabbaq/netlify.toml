# ════════════════════════════════════════════════════════════════════════
# إعداد Netlify لسبّاق
#
# هذا الملف داخل `sabbaq/` لا في جذر المستودع، لأن الجذر يحتوي مشروعًا آخر
# ولا يصحّ أن يُحسَم إعداده هنا. Netlify يبحث عن netlify.toml بالترتيب:
# مجلّد الحزمة ← المجلّد الأساسي ← الجذر — فيجده هنا متى ضُبط
# **Base directory = sabbaq** في لوحة Netlify (خطوة إلزامية، انظر
# docs/deployment.md).
#
# لا نُعلن `base` هنا: تعريفه في ملف غير جذري لا معنى له، وتعريفه في ملف
# جذري يتغلّب على إعداد اللوحة — وهو ما نتجنّبه.
#
# ════════════════════════════════════════════════════════════════════════

[build]
  command = "npm run build"
  publish = ".next"

# محوّل Next.js مُعلَن صراحة.
#
# التركيب التلقائي الذي توثّقه Netlify يحدث حين يكون الموقع مربوطًا
# بمستودع Git فيكتشف نظام البناء الإطار ويحقن المحوّل. النشر بالرفع عبر
# الـ API لا يمرّ بذلك المسار: أوّل نشر هنا خرج بـ plugin_state = "none"
# وبلا دالة واحدة، فرُفعت الأصول الساكنة وحدها وأعاد كل مسار 404 — وكل
# مسارات سبّاق ديناميكية.
#
# لا نذكر نسخة: الإعلان وحده لا يجمّد شيئًا، وNetlify يجلب الأحدث مع كل
# بناء كما لو رُكِّب تلقائيًا.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # playwright في devDependencies للفحص البصري وحده، ولا حاجة لمتصفّحه في
  # بناء الإنتاج — تخطّي التنزيل يوفّر ~١٥٠MB ودقيقة من زمن البناء
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# لا ترويسات ولا تحويلات هنا: كلها في next.config.ts ليطبّقها Next نفسه،
# فتعمل محليًا وعلى أي مستضيف بنفس الشكل. هذا الملف يحمل ما هو خاصّ بـ
# Netlify فعلًا — أمر البناء ومجلّد النشر وبيئته.
